[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-asr-evaluation"
version = "0.1.0"
description = "Reproducible evaluation pipeline for local OpenAI Whisper models across Hindi, Marathi, and English."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20231117",
    "torch>=2.1.0",
    "jiwer>=3.0.3",
    "pandas>=2.1.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "streamlit>=1.32.0",
    "matplotlib>=3.8.0",
    "plotly>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
asr-eval = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".venv",
    "node_modules",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # handled by formatter / line length awareness in docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["app", "streamlit_app"]
